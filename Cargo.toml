[package]
name = "ffs"
version = "0.1.0"
edition = "2021"
description = "Fork-based deterministic concurrency testing: an rr-style ptrace tracer with checkpoint/branch exploration"
license = "MIT"

[[bin]]
name = "ffs"
path = "src/main.rs"

[dependencies]
libc = "0.2"
nix = { version = "0.29", features = ["ptrace", "signal", "process", "sched", "fs", "mman", "uio", "poll", "term"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
rand = { version = "0.8", features = ["small_rng"] }
rand_chacha = "0.3"
goblin = { version = "0.9", default-features = false, features = ["elf64", "elf32", "endian_fd", "std"] }
log = "0.4"
env_logger = "0.11"

[profile.release]
debug = 1
